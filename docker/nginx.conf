upstream monay_api {
    server api:3000;
}

upstream monay_dashboard {
    server dashboard:5000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

limit_req_zone $binary_remote_addr zone=monay_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=monay_api_general:10m rate=30r/s;

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 4;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    image/svg+xml;

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' wss: ws:; frame-ancestors 'self';" always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;

    location = /pos {
        return 302 /pos/;
    }

    # PWA entry point - no cache
    location = /pos/ {
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        proxy_pass http://monay_api;
    }

    # Service worker - no cache
    location = /pos/service-worker.js {
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        proxy_pass http://monay_api;
    }

    # PWA static assets (JS, CSS, images) - long cache
    location ~* ^/pos/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp|webmanifest)$ {
        proxy_pass http://monay_api;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    # Login endpoint with strict rate limiting
    location = /api/auth/login {
        limit_req zone=monay_login burst=5 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://monay_api;
    }

    # API with general rate limiting
    location ^~ /api/ {
        limit_req zone=monay_api_general burst=50 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://monay_api;
    }

    # Remaining PWA paths
    location ^~ /pos/ {
        proxy_pass http://monay_api;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /runtime-config.js {
        proxy_pass http://monay_api;
    }

    # WebSocket
    location ^~ /socket.io/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_pass http://monay_api;
    }

    # Dashboard
    location / {
        proxy_pass http://monay_dashboard;
    }
}
