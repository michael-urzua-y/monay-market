upstream monay_api {
    server api:3000;
}

upstream monay_dashboard {
    server dashboard:5000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

limit_req_zone $binary_remote_addr zone=monay_login:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;

    location = /pos {
        return 302 /pos/;
    }

    location = /pos/ {
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        proxy_pass http://monay_api;
    }

    location = /pos/service-worker.js {
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        proxy_pass http://monay_api;
    }

    location = /api/auth/login {
        limit_req zone=monay_login burst=5 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://monay_api;
    }

    location ^~ /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://monay_api;
    }

    location ^~ /pos/ {
        proxy_pass http://monay_api;
    }

    location = /runtime-config.js {
        proxy_pass http://monay_api;
    }

    location ^~ /socket.io/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://monay_api;
    }

    location / {
        proxy_pass http://monay_dashboard;
    }
}
