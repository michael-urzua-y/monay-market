# DNS interno de Docker: las IP de api/dashboard cambian cada vez que se recrean
# (docker compose up --build). Con "resolve" nginx las vuelve a consultar en vez de
# quedarse con la IP del arranque y responder 502.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream monay_api {
    zone monay_api 64k;
    server api:3000 resolve;
}

upstream monay_dashboard {
    zone monay_dashboard 64k;
    server dashboard:5000 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

limit_req_zone $binary_remote_addr zone=monay_login:10m rate=10r/m;

# Solo los envíos del formulario de login cuentan (abrir la página no)
map $request_method $monay_login_post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $monay_login_post_key zone=monay_panel_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=monay_api_general:10m rate=30r/s;

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 4;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    image/svg+xml;

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # Security headers
    include /etc/nginx/snippets/security-headers.conf;

    # IP real del visitante: la entrega el nginx del VPS (red interna de Docker) en X-Real-IP.
    # Así los límites de intentos se aplican por persona y no a todos juntos.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Se reemplaza (no se agrega): la API confía en este valor para limitar intentos de login
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;

    location = /pos {
        return 302 /pos/;
    }

    # PWA entry point - no cache
    location = /pos/ {
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://monay_api;
    }

    # Service worker - no cache
    location = /pos/service-worker.js {
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://monay_api;
    }

    # PWA static assets (JS, CSS, images) - long cache
    location ~* ^/pos/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp|webmanifest)$ {
        proxy_pass http://monay_api;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Login endpoint with strict rate limiting
    location = /api/auth/login {
        limit_req zone=monay_login burst=5 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://monay_api;
    }

    # API with general rate limiting
    location ^~ /api/ {
        limit_req zone=monay_api_general burst=50 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://monay_api;
    }

    # Remaining PWA paths
    location ^~ /pos/ {
        proxy_pass http://monay_api;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /runtime-config.js {
        proxy_pass http://monay_api;
    }

    # WebSocket
    location ^~ /socket.io/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_pass http://monay_api;
    }

    # Login del panel: límite de envíos por IP (abrir la página no cuenta)
    location = /login {
        limit_req zone=monay_panel_login burst=5 nodelay;
        proxy_pass http://monay_dashboard;
    }

    # Dashboard
    location / {
        proxy_pass http://monay_dashboard;
    }
}
