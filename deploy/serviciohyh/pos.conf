# Virtual host para el nginx existente del VPS (se copia a /opt/taller/nginx/conf.d/).
# Cloudflare (modo Full) → hyh-nginx → contenedor monay-web (nginx interno de Monay).

# WebSocket (socket.io): nombre propio para no chocar con otros archivos de conf.d
map $http_upgrade $pos_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name pos.serviciohyh.cl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pos.serviciohyh.cl;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Certificados SII (.pfx) y fotos de productos
    client_max_body_size 25m;

    # IP real del visitante: CF-Connecting-IP solo si la conexión viene de Cloudflare.
    # Rangos: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # El contenedor se resuelve en cada petición y no al arrancar: si Monay está apagado,
    # solo pos.serviciohyh.cl responde 502 y nginx sigue funcionando para los demás sitios.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $pos_upstream http://monay-web:80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location /socket.io/ {
        proxy_pass $pos_upstream;
        # Definir cabeceras aquí anula las heredadas del server: se repiten todas
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pos_connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass $pos_upstream;
    }
}
