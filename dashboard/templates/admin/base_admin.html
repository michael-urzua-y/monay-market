<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#c9952a">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}Admin{% endblock %} — Monay Market</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='monay-market-logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        /* Admin-specific overrides using the same design tokens as main dashboard */
        .admin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; }
        .admin-stat { background: var(--color-white); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm); }
        .admin-stat-label { color: var(--color-text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
        .admin-stat-value { font-size: 1.8rem; font-weight: 800; color: var(--color-primary); margin-top: 4px; }
        .user-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .user-actions .btn { padding: 5px 10px; font-size: 0.8rem; }
        .admin-modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:1000; align-items:center; justify-content:center; }
        .admin-modal-overlay.visible { display: flex; }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar navigation (same structure as main dashboard) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="{{ url_for('admin_dashboard') }}" class="sidebar-logo" aria-label="Monay Admin">
                    <img
                        src="{{ url_for('static', filename='monay-market-logo-horizontal.png') }}"
                        alt="Monay Market"
                        class="sidebar-logo-image"
                    >
                </a>
            </div>

            <nav class="sidebar-nav">
                <a href="{{ url_for('admin_dashboard') }}" class="nav-item {% if request.endpoint == 'admin_dashboard' %}active{% endif %}">
                    <span class="nav-icon">📊</span>
                    <span class="nav-label">Panel</span>
                </a>
                <a href="{{ url_for('admin_tenant_create') }}" class="nav-item {% if request.endpoint == 'admin_tenant_create' %}active{% endif %}">
                    <span class="nav-icon">➕</span>
                    <span class="nav-label">Nuevo negocio</span>
                </a>
            </nav>
        </aside>

        <!-- Main content area -->
        <main class="main-content">
            <header class="top-bar">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <h2 class="page-title" style="margin: 0;">{% block page_title %}Admin{% endblock %}</h2>
                </div>

                <div class="top-bar-right">
                    <div class="user-info top-user-info">
                        <div class="user-name">superadmin</div>
                    </div>
                    <a href="{{ url_for('logout') }}" class="btn btn-secondary top-logout-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        <span class="hide-mobile">Salir</span>
                    </a>
                </div>
            </header>

            <div class="content-area">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
</body>
</html>
