{% if total_pages and total_pages > 1 %}
<div class="pagination table-footer">
    <span class="pagination-info">{{ pagination_label }}</span>
    <div class="pagination-buttons">
        <a href="{{ previous_url }}"
           class="btn btn-sm btn-secondary"
           {% if disable_previous %}style="pointer-events: none; opacity: 0.5;"{% endif %}>Anterior</a>
        <a href="{{ next_url }}"
           class="btn btn-sm btn-secondary"
           {% if disable_next %}style="pointer-events: none; opacity: 0.5;"{% endif %}>Siguiente</a>
    </div>
</div>
{% endif %}
