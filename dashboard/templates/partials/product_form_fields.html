<div class="form-group">
    <label for="barcode">Código de barras</label>
    {% if show_barcode_tools %}
    <div style="display: flex; gap: 8px;">
        <input type="text" id="barcode" name="barcode" value="{{ form_values.get('barcode', '') or '' }}" placeholder="Ej: 7801234567890" style="flex: 1;">
        <button type="button" class="btn btn-secondary" onclick="openScanner()" title="Escanear con cámara" style="padding: 0 12px; font-size: 1.2rem;">📷</button>
        <button type="button" class="btn btn-secondary"
                hx-get=""
                hx-target="#barcode-result"
                hx-swap="innerHTML"
                id="lookup-btn"
                onclick="this.setAttribute('hx-get', '/htmx/products/lookup-barcode/' + document.getElementById('barcode').value); htmx.process(this); htmx.trigger(this, 'click');"
                style="white-space: nowrap;">
            🔍 Buscar
        </button>
    </div>
    <div id="barcode-result" style="margin-top: 4px;"></div>
    {% else %}
    <input type="text" id="barcode" name="barcode" value="{{ form_values.get('barcode', '') or '' }}" placeholder="Ej: 7801234567890">
    {% endif %}
</div>

<div class="form-group">
    <label for="name">Nombre *</label>
    <input type="text" id="name" name="name" value="{{ form_values.get('name', '') }}" required placeholder="Nombre del producto">
</div>

<div class="form-group">
    <label for="price">Precio (CLP) *</label>
    <input type="number" id="price" name="price" value="{{ form_values.get('price', '') }}" required min="1" placeholder="Ej: 1490">
</div>

<div class="form-group">
    <label for="stock">{{ stock_label }} *</label>
    <input type="number" id="stock" name="stock" value="{{ form_values.get('stock', 0) }}" required min="0" step="any" placeholder="0.000">
</div>

<div class="form-group">
    <label for="critical_stock">Stock crítico</label>
    <input type="number" id="critical_stock" name="critical_stock" value="{{ form_values.get('critical_stock', 0) }}" min="0" step="any" placeholder="0.000">
</div>

<div class="form-group" style="display: flex; align-items: center; gap: 8px; margin-top: 16px; margin-bottom: 16px;">
    <input type="checkbox" id="is_weighed" name="is_weighed" {% if form_values.get('is_weighed') %}checked{% endif %} style="width: 20px; height: 20px; accent-color: var(--color-primary);">
    <label for="is_weighed" style="margin: 0; font-weight: 600; cursor: pointer;">Se vende por peso / a granel</label>
</div>

<div class="form-group">
    <label for="category_id">Categoría</label>
    <select id="category_id" name="category_id">
        <option value="">Sin categoría</option>
        {% for cat_id, cat_name in categories.items() %}
        <option value="{{ cat_id }}" {% if current_category_id == cat_id %}selected{% endif %}>{{ cat_name }}</option>
        {% endfor %}
    </select>
</div>
