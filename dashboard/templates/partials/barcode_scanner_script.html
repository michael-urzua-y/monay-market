<script>
    let scannerStream = null;
    let scannerActive = false;

    function openScanner() {
        const overlay = document.getElementById('scanner-overlay');
        const video = document.getElementById('scanner-video');
        const statusEl = document.getElementById('scanner-status');

        overlay.style.display = 'flex';
        statusEl.textContent = 'Iniciando cámara...';
        scannerActive = true;

        navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        }).then(function (stream) {
            scannerStream = stream;
            video.srcObject = stream;
            video.play();
            statusEl.textContent = 'Apunte la cámara al código de barras';
            startBarcodeDetection(video, statusEl);
        }).catch(function () {
            statusEl.textContent = '{{ scanner_camera_error|default("No se pudo acceder a la cámara. Revise los permisos.") }}';
        });
    }

    function startBarcodeDetection(video, statusEl) {
        if ('BarcodeDetector' in window) {
            const detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'upc_a', 'upc_e'] });
            const detectFrame = function () {
                if (!scannerActive) return;
                detector.detect(video).then(function (barcodes) {
                    if (barcodes.length > 0) {
                        handleBarcodeDetected(barcodes[0].rawValue);
                        return;
                    }
                    requestAnimationFrame(detectFrame);
                }).catch(function () {
                    requestAnimationFrame(detectFrame);
                });
            };
            detectFrame();
        } else {
            statusEl.textContent = '{{ scanner_not_supported_message|default("Su navegador no soporta lectura automática. Ingrese el código manualmente.") }}';
        }
    }

    function handleBarcodeDetected(code) {
        closeScanner();
        if (typeof window.onBarcodeScanned === 'function') {
            window.onBarcodeScanned(code);
        }
    }

    function closeScanner() {
        scannerActive = false;
        const overlay = document.getElementById('scanner-overlay');
        overlay.style.display = 'none';

        if (scannerStream) {
            scannerStream.getTracks().forEach(track => track.stop());
            scannerStream = null;
        }
        const video = document.getElementById('scanner-video');
        if (video) video.srcObject = null;
    }
</script>
