<div id="scanner-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; flex-direction: column; align-items: center; justify-content: center;">
    <div class="card" style="width: 90%; max-width: 500px; text-align: center; padding: 20px;">
        <h3 style="margin-bottom: 16px; margin-top: 0;">{{ scanner_title|default('Escanear producto') }}</h3>
        <div style="position: relative; width: 100%; max-height: 60vh; overflow: hidden; background: #000; border-radius: 8px;">
            <video id="scanner-video" style="width: 100%; height: auto;" playsinline></video>
        </div>
        <p id="scanner-status" style="margin: 16px 0; color: var(--color-text-muted); font-size: 0.9rem;">Iniciando cámara...</p>
        <button type="button" class="btn btn-secondary" onclick="closeScanner()" style="width: 100%;">Cancelar</button>
    </div>
</div>
