{% from "partials/icons.html" import icon %}
<div class="kpi">
    <div class="kpi-head">
        <span class="kpi-label">Acumulado mensual</span>
        <span class="kpi-icon">{{ icon('tendencia-arriba', 18) }}</span>
    </div>
    <div class="kpi-value">{{ mes_actual }}</div>
    {% if variacion is not none %}
    <div class="kpi-note {{ 'is-up' if variacion >= 0 else 'is-down' }}">
        {{ '▲' if variacion >= 0 else '▼' }} {{ variacion|abs }} % vs. mes anterior ({{ mes_anterior }})
    </div>
    {% else %}
    <div class="kpi-note">Sin datos del mes anterior</div>
    {% endif %}
</div>
