<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#06100d">
  <title>Prueba SumUp — Monay Market</title>
  <style>
    :root { --ink: #06100d; --yellow: #F5C518; --muted: #5d6762; --border: #e3e1d8; --ok: #1f8a4c; --bad: #c0392b; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #F7F6F1; color: var(--ink); }
    main { max-width: 460px; margin: 0 auto; padding: 24px 16px 40px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p.lead { margin: 0 0 20px; color: var(--muted); font-size: 0.95rem; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin: 12px 0 6px; }
    label:first-child { margin-top: 0; }
    input[type=text], input[type=number] { width: 100%; height: 46px; border: 1px solid var(--border); border-radius: 12px; padding: 0 12px; font-size: 1rem; }
    .check { display: flex; align-items: center; gap: 8px; font-weight: 500; margin-top: 14px; }
    button { width: 100%; height: 54px; margin-top: 18px; border: 0; border-radius: 14px; background: var(--ink); color: var(--yellow); font-size: 1.05rem; font-weight: 700; }
    .result h2 { margin: 0 0 8px; font-size: 1.15rem; }
    .result.ok h2 { color: var(--ok); }
    .result.bad h2 { color: var(--bad); }
    pre { white-space: pre-wrap; word-break: break-all; background: #F1F0E8; border-radius: 10px; padding: 10px; font-size: 0.8rem; margin: 8px 0 0; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
<main>
  <h1>Prueba de cobro con SumUp</h1>
  <p class="lead">Abre la app de SumUp con el monto cargado y muestra lo que SumUp devuelve a Monay.</p>

  <section id="result" class="card result" hidden></section>

  <form id="form" class="card">
    <label for="key">Clave de afiliado</label>
    <input id="key" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sup_afk_..." required>

    <label for="appId">ID de aplicación</label>
    <input id="appId" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="cl.monaymarket.pos" required>

    <label for="total">Monto (CLP)</label>
    <input id="total" type="number" inputmode="numeric" min="1" step="1" value="100" required>

    <label class="check"><input id="decimals" type="checkbox"> Enviar el monto con decimales (100.00)</label>
    <label class="check"><input id="skipSuccess" type="checkbox"> Saltar la pantalla de éxito de SumUp</label>

    <button type="submit">Cobrar con SumUp</button>
    <p class="hint">La clave queda guardada solo en este celular.</p>
  </form>

  <section class="card">
    <strong>Enlace generado</strong>
    <pre id="link">—</pre>
  </section>
</main>

<script>
(function () {
  var STORE = 'monay-sumup-prueba';
  var form = document.getElementById('form');
  var fields = ['key', 'appId', 'total'].reduce(function (acc, id) { acc[id] = document.getElementById(id); return acc; }, {});

  try {
    var saved = JSON.parse(localStorage.getItem(STORE) || '{}');
    if (saved.key) fields.key.value = saved.key;
    if (saved.appId) fields.appId.value = saved.appId;
  } catch (e) { /* sin almacenamiento: se escribe cada vez */ }

  // Respuesta de SumUp: vuelve a esta misma página con parámetros smp-*
  var params = new URLSearchParams(location.search);
  if (params.has('smp-status')) {
    var status = params.get('smp-status');
    var box = document.getElementById('result');
    var title = document.createElement('h2');
    title.textContent = status === 'success' ? 'Pago aprobado' : 'Pago no realizado (' + status + ')';
    var pre = document.createElement('pre');
    var lines = [];
    params.forEach(function (value, name) { lines.push(name + ' = ' + value); });
    pre.textContent = lines.join('\n');
    box.className = 'card result ' + (status === 'success' ? 'ok' : 'bad');
    box.append(title, pre);
    box.hidden = false;
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    var key = fields.key.value.trim();
    var appId = fields.appId.value.trim();
    var amount = String(parseInt(fields.total.value, 10));
    if (document.getElementById('decimals').checked) amount += '.00';
    try { localStorage.setItem(STORE, JSON.stringify({ key: key, appId: appId })); } catch (e) { /* opcional */ }

    var txId = 'monay-prueba-' + Date.now();
    var back = location.origin + location.pathname;
    var query = new URLSearchParams({
      'affiliate-key': key,
      'app-id': appId,
      'total': amount,
      'amount': amount,
      'currency': 'CLP',
      'title': 'Prueba Monay',
      'foreign-tx-id': txId,
      // Android usa "callback"; iOS usa "callbacksuccess" y "callbackfail"
      'callback': back + '?via=callback&tx=' + txId,
      'callbacksuccess': back + '?via=success&tx=' + txId,
      'callbackfail': back + '?via=fail&tx=' + txId
    });
    if (document.getElementById('skipSuccess').checked) query.set('skip-screen-success', 'true');

    var link = 'sumupmerchant://pay/1.0?' + query.toString();
    document.getElementById('link').textContent = link.replace(encodeURIComponent(key), '••••');
    location.href = link;
  });
})();
</script>
</body>
</html>
